name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Run tests
      run: go test -v -race ./...

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Generate changelog
      id: changelog
      run: |
        # Get the previous tag
        PREV_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")
        if [ -z "$PREV_TAG" ]; then
          PREV_TAG=$(git rev-list --max-parents=0 HEAD)
        fi

        # Generate changelog
        {
          echo "CHANGELOG<<EOF"
          git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges
          echo ""
          echo "EOF"
        } >> $GITHUB_OUTPUT

    - name: Build binaries
      run: |
        # Build for multiple platforms
        GOOS=linux GOARCH=amd64 go build -o bin/s3-directory-listing-linux-amd64 ./cmd/s3-directory-listing
        GOOS=linux GOARCH=arm64 go build -o bin/s3-directory-listing-linux-arm64 ./cmd/s3-directory-listing
        GOOS=darwin GOARCH=amd64 go build -o bin/s3-directory-listing-darwin-amd64 ./cmd/s3-directory-listing
        GOOS=darwin GOARCH=arm64 go build -o bin/s3-directory-listing-darwin-arm64 ./cmd/s3-directory-listing
        GOOS=windows GOARCH=amd64 go build -o bin/s3-directory-listing-windows-amd64.exe ./cmd/s3-directory-listing

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.VERSION }}
        name: Release ${{ steps.get_version.outputs.VERSION }}
        body: |
          ## Changes in ${{ steps.get_version.outputs.VERSION }}

          ${{ steps.changelog.outputs.CHANGELOG }}

          ## Installation

          ### Using Go
          ```bash
          go install github.com/teamsbc/s3-directory-listing/cmd/s3-directory-listing@${{ steps.get_version.outputs.VERSION }}
          ```

          ### Download Binary
          Download the appropriate binary for your platform from the assets below.
        files: |
          bin/s3-directory-listing-*
        draft: false
        prerelease: false
